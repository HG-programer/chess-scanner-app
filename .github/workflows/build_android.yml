name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  build:
    name: Compile Android Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: 🛠️ Generate Official Android Platform
        working-directory: mobile_app
        run: |
          rm -rf android
          flutter create --org com.chessscanner --project-name chess_scanner --platforms android .
          python3 -c "
          manifest = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest, 'r') as f:
              c = f.read()
          c = c.replace('<application', '    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application')
          c = c.replace('<activity', '        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\"/>\n        <activity')
          with open(manifest, 'w') as f:
              f.write(c)

          # Enforce minSdkVersion 21 for google_mobile_ads & camera
          app_gradle = 'android/app/build.gradle'
          with open(app_gradle, 'r') as f:
              g = f.read()
          g = g.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
          g = g.replace('minSdkVersion = flutter.minSdkVersion', 'minSdkVersion = 21')
          with open(app_gradle, 'w') as f:
              f.write(g)

          # Enforce Gradle 8.7 wrapper (prevents Gradle 9 incompatibility with plugins)
          wrapper = 'android/gradle/wrapper/gradle-wrapper.properties'
          with open(wrapper, 'r') as f:
              w = f.read()
          import re
          w = re.sub(r'gradle-.*-(all|bin)\.zip', 'gradle-8.7-all.zip', w)
          with open(wrapper, 'w') as f:
              f.write(w)
          "

      - name: 📦 Install Flutter Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: 🔨 Build Android APK (For Personal Testing / Sideloading)
        working-directory: mobile_app
        run: flutter build apk --release --no-tree-shake-icons --verbose

      - name: 🚀 Build Android App Bundle (For Google Play Store Console)
        working-directory: mobile_app
        run: flutter build appbundle --release --no-tree-shake-icons --verbose

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-scanner-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 📤 Upload Google Play Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-scanner-google-play-aab
          path: mobile_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
