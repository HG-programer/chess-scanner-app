name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  build:
    name: Compile Android Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: 🛠️ Generate Official Android Platform & Configure Release Signing
        working-directory: mobile_app
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || '' }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 || '' }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || '' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || '' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || '' }}
        run: |
          rm -rf android
          flutter create --org com.chessscanner --project-name chess_scanner --platforms android .
          cp -rf assets/icons/mipmap-* android/app/src/main/res/
          python3 scripts/configure_android.py

      - name: 📦 Install Flutter Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: 🔨 Build Android APK (For Personal Testing / Sideloading)
        working-directory: mobile_app
        run: |
          flutter build apk --release --no-tree-shake-icons --verbose > build.log 2>&1 || (tail -n 120 build.log && exit 1)

      - name: 🚀 Build Android App Bundle (For Google Play Store Console)
        working-directory: mobile_app
        run: |
          flutter build appbundle --release --no-tree-shake-icons --verbose > bundle.log 2>&1 || (tail -n 120 bundle.log && exit 1)

      - name: 📤 Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chess-scanner-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 📤 Upload Google Play Bundle (AAB) Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chess-scanner-google-play-aab
          path: mobile_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: 📄 Upload Build Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-diagnostic
          path: |
            mobile_app/build.log
            mobile_app/bundle.log
          retention-days: 7
