name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  build:
    name: Compile Android Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: 🛠️ Generate Official Android Platform
        working-directory: mobile_app
        run: |
          rm -rf android
          flutter create --org com.chessscanner --project-name chess_scanner --platforms android .
          python3 -c "
          import glob, re
          # Update AndroidManifest.xml
          for m in glob.glob('android/app/src/main/AndroidManifest.xml'):
              with open(m, 'r') as f:
                  c = f.read()
              if 'android.permission.CAMERA' not in c:
                  c = c.replace('<application', '    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application')
              if 'APPLICATION_ID' not in c:
                  c = c.replace('<activity', '        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\"/>\n        <activity')
              with open(m, 'w') as f:
                  f.write(c)

          # Update build.gradle / build.gradle.kts with minSdkVersion 21
          for g in glob.glob('android/app/build.gradle*'):
              with open(g, 'r') as f:
                  txt = f.read()
              txt = txt.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
              txt = txt.replace('minSdkVersion = flutter.minSdkVersion', 'minSdkVersion = 21')
              with open(g, 'w') as f:
                  f.write(txt)

          # Ensure Gradle wrapper is 8.7 (compatible with plugins)
          for w in glob.glob('android/gradle/wrapper/gradle-wrapper.properties'):
              with open(w, 'r') as f:
                  wrap = f.read()
              wrap = re.sub(r'gradle-.*-(all|bin)\.zip', 'gradle-8.7-all.zip', wrap)
              with open(w, 'w') as f:
                  f.write(wrap)
          "

      - name: 📦 Install Flutter Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: 🔨 Build Android APK (For Personal Testing / Sideloading)
        working-directory: mobile_app
        run: |
          flutter build apk --release --no-tree-shake-icons --verbose > build.log 2>&1 || (tail -n 120 build.log && exit 1)

      - name: 🚀 Build Android App Bundle (For Google Play Store Console)
        working-directory: mobile_app
        run: |
          flutter build appbundle --release --no-tree-shake-icons --verbose > bundle.log 2>&1 || (tail -n 120 bundle.log && exit 1)

      - name: 📤 Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chess-scanner-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 📤 Upload Google Play Bundle (AAB) Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chess-scanner-google-play-aab
          path: mobile_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: 📄 Upload Build Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-diagnostic
          path: |
            mobile_app/build.log
            mobile_app/bundle.log
          retention-days: 7
